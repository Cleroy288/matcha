server {
    listen 80;

    # Un cran au-dessus de MAX_CONTENT_LENGTH côté Flask (5 Mo) : nginx reste un
    # garde-fou grossier, mais c'est Flask qui produit le message d'erreur vu par
    # l'utilisateur. Au-delà, les error_page ci-dessous répondent en JSON.
    client_max_body_size 6m;

    # nginx génère ses propres erreurs avant d'atteindre Flask (corps trop gros,
    # backend injoignable) : sans ça, le front reçoit du HTML et res.json() lève
    # une SyntaxError.
    error_page 413 = @error_too_large;
    error_page 502 503 504 = @error_unavailable;

    location @error_too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin http://localhost:5173 always;
        add_header Access-Control-Allow-Credentials true always;
        return 413 '{"error":"Uploaded file is too large"}';
    }

    location @error_unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin http://localhost:5173 always;
        add_header Access-Control-Allow-Credentials true always;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://backend:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
