server {
    listen 80;

    # One step above MAX_CONTENT_LENGTH on the Flask side (5 MB): nginx stays a
    # coarse guard rail, but Flask is what produces the error message the user
    # sees. Beyond that, the error_page directives below answer in JSON.
    client_max_body_size 6m;

    # nginx generates its own errors before reaching Flask (body too large,
    # backend unreachable): without this the frontend gets HTML and res.json()
    # throws a SyntaxError.
    error_page 413 = @error_too_large;
    error_page 502 503 504 = @error_unavailable;

    location @error_too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin http://localhost:5173 always;
        add_header Access-Control-Allow-Credentials true always;
        return 413 '{"error":"Uploaded file is too large"}';
    }

    location @error_unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin http://localhost:5173 always;
        add_header Access-Control-Allow-Credentials true always;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://backend:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
